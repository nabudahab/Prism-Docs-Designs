<!doctype html>
<html lang="en" data-design="datasheet">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism documentation</title>
  <meta name="description" content="Prism: a bare-metal SoC in synthesizable SystemVerilog for firmware and RTL engineers. Architecture overview, firmware address map and PlatformIO build reference.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/prism-mark.svg" type="image/svg+xml">
  <!-- canon:styles -->
  <link rel="stylesheet" href="assets/design/design.css">
  <!-- canon:head-script -->
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="ds-bar">

      <span class="visually-hidden" id="menu-label">Open navigation</span>
    </button>
    <a class="ds-brand" href="#/" aria-label="Prism documentation home">
      <svg viewBox="0 0 40 32" width="30" height="24" aria-hidden="true">
        <path d="M17 3.5 L28.5 27 L5.5 27 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="miter"/>
        <path d="M1 20.7 L11 16.6" stroke="currentColor" stroke-width="2"/>
        <path d="M22.3 14.6 L39 7.3" stroke="var(--c-system)" stroke-width="2.2"/>
        <path d="M23 16 L39 12.7" stroke="var(--c-mmio)" stroke-width="2.2"/>
        <path d="M23.6 17.3 L39 18.2" stroke="var(--c-bus)" stroke-width="2.2"/>
        <path d="M24.3 18.7 L39 23.7" stroke="var(--c-cache)" stroke-width="2.2"/>
      </svg>
      <span class="ds-brand-name">Prism</span>
    </a>
    <nav class="ds-trail" aria-label="You are here"><ol id="ds-trail"></ol></nav>
    <button class="ds-find" type="button" id="ds-find" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5.5 5.5" stroke="currentColor" stroke-width="2"/></svg>
      <span class="ds-find-text">Find a page, register or address</span>
      <kbd aria-hidden="true">/</kbd>
    </button>
    <button class="ds-icon" type="button" id="theme-button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
      <span class="visually-hidden" id="theme-label">Switch theme</span>
    </button>
  </header>

  <div class="ds-frame">
    <nav class="ds-tree" id="sidebar" aria-label="Documentation">
      <div class="ds-tree-head">
        <span>Contents</span>
        <button class="ds-icon" type="button" id="close-button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8"/></svg>
          <span class="visually-hidden">Close navigation</span>
        </button>
      </div>
      <div id="ds-tree"></div>
    </nav>
    <div class="backdrop" id="backdrop" hidden></div>

    <main id="main" tabindex="-1">
      <noscript>
        <div class="notice notice-error">
          <h1>JavaScript is off</h1>
          <p>This documentation renders its pages with local JavaScript. Enable JavaScript to read it.</p>
        </div>
      </noscript>
    </main>

    <aside class="ds-inspector" id="ds-inspector" aria-label="On this page" hidden></aside>
  </div>

  <dialog class="ds-palette" id="ds-palette" aria-label="Find a page, register or address">
    <div class="ds-palette-field">
      <label class="visually-hidden" for="ds-query">Find a page, register or address</label>
      <input id="ds-query" type="search" autocomplete="off" spellcheck="false" placeholder="uart, irq_enable, 0x40020008, verification…">
      <button class="ds-palette-close" type="button" id="ds-palette-close">Close</button>
    </div>
    <ul class="ds-results" id="ds-results" hidden></ul>
    <p class="ds-palette-status" id="ds-palette-status" role="status"></p>
  </dialog>

  <div class="visually-hidden" aria-live="polite" id="announcer"></div>

  <!-- canon:scripts -->
  <script src="data/nav.js"></script>
  <script src="assets/design/kit.js"></script>
  <script src="assets/design/design.js"></script>
